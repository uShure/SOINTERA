<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOINTERA - Консультации</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            line-height: 1.4;
            font-size: 16px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 12px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #e0e0e0);
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--tg-theme-text-color, #000000);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .consultation-card {
            background: var(--tg-theme-secondary-bg-color, #f8f9fa);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--tg-theme-hint-color, #e0e0e0);
        }

        .consultation-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--tg-theme-text-color, #000000);
        }

        .consultation-description {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #666666);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .consultation-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--tg-theme-button-color, #0088cc);
            margin-bottom: 12px;
        }

        .btn {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--tg-theme-secondary-bg-color, #f8f9fa);
            color: var(--tg-theme-text-color, #000000);
            border: 1px solid var(--tg-theme-hint-color, #e0e0e0);
        }

        .btn-secondary:hover {
            background: var(--tg-theme-hint-color, #e0e0e0);
        }

        .features {
            margin-top: 16px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .feature-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            color: var(--tg-theme-button-color, #0088cc);
        }

        .contact-info {
            background: var(--tg-theme-secondary-bg-color, #f8f9fa);
            border-radius: 6px;
            padding: 12px;
            margin-top: 16px;
            text-align: center;
        }

        .contact-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .contact-text {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #666666);
            margin-bottom: 8px;
        }

        .contact-link {
            color: var(--tg-theme-button-color, #0088cc);
            text-decoration: none;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .container {
                padding: 8px;
            }
            
            .consultation-card {
                padding: 12px;
            }
            
            .logo {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">SOINTERA</div>
            <div class="subtitle">Профессиональные консультации</div>
        </div>

        <div id="content">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Настраиваем Web App
        tg.ready();
        tg.expand();
        
        // Устанавливаем тему
        document.body.style.backgroundColor = tg.themeParams.bg_color || '#ffffff';
        document.body.style.color = tg.themeParams.text_color || '#000000';

        // Контент приложения
        const consultations = [
            {
                id: 'basic',
                title: 'Базовая консультация',
                description: 'Первичная консультация по выбору курса, определению уровня подготовки и составлению плана обучения.',
                price: 'Бесплатно',
                duration: '15-20 минут',
                features: [
                    'Анализ текущего уровня',
                    'Рекомендации по курсам',
                    'Ответы на вопросы',
                    'План развития'
                ]
            },
            {
                id: 'advanced',
                title: 'Расширенная консультация',
                description: 'Детальная консультация с анализом портфолио, составлением индивидуального плана обучения и рекомендациями по карьере.',
                price: '2 000 ₽',
                duration: '45-60 минут',
                features: [
                    'Анализ портфолио',
                    'Индивидуальный план',
                    'Карьерные рекомендации',
                    'Связь с менеджером'
                ]
            },
            {
                id: 'premium',
                title: 'Премиум консультация',
                description: 'Полная консультация с мастером, включая практические советы, разбор техник и персональные рекомендации.',
                price: '5 000 ₽',
                duration: '90 минут',
                features: [
                    'Консультация с мастером',
                    'Практические советы',
                    'Разбор техник',
                    'Персональные рекомендации',
                    'Последующая поддержка'
                ]
            }
        ];

        function renderContent() {
            const content = document.getElementById('content');
            
            let html = '';
            
            consultations.forEach(consultation => {
                html += `
                    <div class="consultation-card">
                        <div class="consultation-title">${consultation.title}</div>
                        <div class="consultation-description">${consultation.description}</div>
                        <div class="consultation-price">${consultation.price}</div>
                        
                        <div class="features">
                            ${consultation.features.map(feature => `
                                <div class="feature-item">
                                    <span class="feature-icon">✓</span>
                                    <span>${feature}</span>
                                </div>
                            `).join('')}
                        </div>
                        
                        <button class="btn btn-primary" onclick="selectConsultation('${consultation.id}')">
                            Выбрать консультацию
                        </button>
                    </div>
                `;
            });
            
            html += `
                <div class="contact-info">
                    <div class="contact-title">Нужна помощь с выбором?</div>
                    <div class="contact-text">Наш менеджер поможет подобрать подходящую консультацию</div>
                    <a href="https://t.me/natalylini" class="contact-link" target="_blank">
                        Связаться с менеджером
                    </a>
                </div>
            `;
            
            content.innerHTML = html;
        }

        function selectConsultation(consultationId) {
            const consultation = consultations.find(c => c.id === consultationId);
            
            if (!consultation) {
                showError('Консультация не найдена');
                return;
            }
            
            // Показываем подтверждение
            const message = `Вы выбрали: ${consultation.title}\n\nЦена: ${consultation.price}\nДлительность: ${consultation.duration}\n\nДля записи на консультацию свяжитесь с нашим менеджером.`;
            
            // Отправляем данные в Telegram
            tg.sendData(JSON.stringify({
                action: 'consultation_selected',
                consultation: consultation,
                timestamp: new Date().toISOString()
            }));
            
            // Показываем уведомление
            tg.showAlert(message, () => {
                // После закрытия алерта можно выполнить дополнительные действия
                tg.close();
            });
        }

        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="error">${message}</div>
                <button class="btn btn-secondary" onclick="renderContent()">Попробовать снова</button>
            `;
        }

        // Обработка ошибок
        window.addEventListener('error', (e) => {
            console.error('Ошибка:', e.error);
            showError('Произошла ошибка. Попробуйте обновить страницу.');
        });

        // Запускаем приложение
        document.addEventListener('DOMContentLoaded', () => {
            try {
                renderContent();
            } catch (error) {
                console.error('Ошибка инициализации:', error);
                showError('Ошибка загрузки приложения');
            }
        });
    </script>
</body>
</html>
